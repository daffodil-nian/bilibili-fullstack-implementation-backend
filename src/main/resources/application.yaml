snow:
  worker-id: 1
spring:
  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
  profiles:
    active: local
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      database: ${redis.database}
      password: ${redis.password}
  datasource:
    url: ${spring.db.url}
    username: ${spring.db.username}
    password: ${spring.db.password}
  jwt:
    secret: ${bili-chat.jwt.secret}
  oss:
    endpoint: ${OSS.endpoint}
    accessKeyId: ${OSS.accessKeyId}
    accessKeySecret: ${OSS.accessKeySecret}
    bucketName: ${OSS.bucket}
    domain: ${OSS.region}
  elasticsearch:
    uris: ${ES.host}
    username: ${ES.username}
    password: ${ES.password}
  application:
    name: ${bili-chat.name}

cos:
  client:
    secret-id: ${COS.secretId}
    secret-key: ${COS.secretKey}
    region: ${COS.region}
    bucket: ${COS.bucket}
    host: ${COS.host}
#    bucket-name: ${COS.}
server:
  netty:
    port: ${netty.port}


bili:
  im:
    push-via-mq: true
